<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>COUNT DEFECT</title>
    <!-- iOS Web App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="COUNT DEFECT">
    
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200/80">
        <div class="max-w-md mx-auto px-4 h-14 flex justify-between items-center relative">
            
            <!-- Left Action: Back or Home -->
            <div class="w-20 flex items-center">
                <button id="backBtn" onclick="navToHome()" class="hidden items-center text-slate-600 hover:text-slate-900 text-sm font-medium transition active:scale-95">
                    <i data-lucide="chevron-left" class="w-5 h-5 mr-0.5"></i>
                    <span>กลับ</span>
                </button>
                <button id="homeBtn" onclick="navToHome()" class="flex items-center text-slate-600 hover:text-slate-900 text-xs font-semibold tracking-wide uppercase transition active:scale-95">
                    <i data-lucide="home" class="w-4 h-4 mr-1"></i>
                    <span>HOME</span>
                </button>
            </div>

            <!-- Header Title -->
            <h1 id="headerTitle" class="text-sm font-semibold tracking-tight text-slate-900 text-center truncate max-w-[180px]">COUNT DEFECT</h1>
            
            <!-- Right Action: Add Building -->
            <div id="headerAction" class="w-20 flex justify-end">
                <button onclick="openModal('building')" class="p-1 text-slate-700 hover:text-slate-900 transition active:scale-95">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 pb-24">
        
        <!-- View 1: Home (Buildings & Areas List) -->
        <div id="homeView" class="space-y-3">
            <div id="buildingList" class="space-y-3">
                <!-- Dynamic Content -->
            </div>
        </div>

        <!-- View 2: Area Defect Detail -->
        <div id="areaView" class="hidden space-y-4">
            <!-- Area Header Card -->
            <div class="flex justify-between items-center bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm">
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-2 rounded-full bg-slate-800"></div>
                    <span id="currentAreaName" class="font-medium text-slate-800 text-sm">-</span>
                </div>
                <button onclick="openModal('defect')" class="flex items-center space-x-1 bg-slate-900 text-white text-xs font-medium px-3 py-1.5 rounded-xl hover:bg-slate-800 transition active:scale-95">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span>เพิ่ม Defect</span>
                </button>
            </div>

            <div id="defectList" class="space-y-3">
                <!-- Dynamic Defect Cards -->
            </div>
        </div>

    </main>

    <!-- Center Modal Dialog (ตั้งชื่อตรงกลางหน้าจอ) -->
    <div id="inputModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-xl border border-slate-100 transform transition-all space-y-4">
            <h3 id="modalTitle" class="text-sm font-semibold text-slate-900 text-center">เพิ่มรายการ</h3>
            
            <input type="text" id="modalInput" placeholder="ระบุชื่อ..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-slate-400 focus:bg-white transition">

            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="closeModal()" class="w-full py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-medium hover:bg-slate-200 transition active:scale-95">ยกเลิก</button>
                <button onclick="submitModal()" class="w-full py-2 bg-slate-900 text-white rounded-xl text-xs font-medium hover:bg-slate-800 transition active:scale-95">ตกลง</button>
            </div>
        </div>
    </div>

    <script>
        // Data State (เริ่มต้นจากหน้าว่างเปล่า)
        let state = {
            currentView: 'home',
            selectedBuildingId: null,
            selectedAreaId: null,
            buildings: []
        };

        let currentModalTarget = null; // 'building', 'area', or 'defect'
        let targetBuildingIdForArea = null;

        document.addEventListener("DOMContentLoaded", () => {
            loadState();
            render();
        });

        function saveState() {
            localStorage.setItem("COUNT_DEFECT_DATA_V2", JSON.stringify(state.buildings));
        }

        function loadState() {
            const data = localStorage.getItem("COUNT_DEFECT_DATA_V2");
            if (data) {
                try { state.buildings = JSON.parse(data); } catch (e) { state.buildings = []; }
            }
        }

        // Render Controller
        function render() {
            saveState();
            const backBtn = document.getElementById('backBtn');
            const homeBtn = document.getElementById('homeBtn');
            const headerTitle = document.getElementById('headerTitle');
            const headerAction = document.getElementById('headerAction');

            if (state.currentView === 'home') {
                document.getElementById('homeView').classList.remove('hidden');
                document.getElementById('areaView').classList.add('hidden');
                
                backBtn.classList.add('hidden');
                homeBtn.classList.remove('hidden');
                headerTitle.innerText = "COUNT DEFECT";
                
                headerAction.innerHTML = `
                    <button onclick="openModal('building')" class="p-1 text-slate-700 hover:text-slate-900 transition active:scale-95">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                `;
                renderBuildings();
            } else {
                document.getElementById('homeView').classList.add('hidden');
                document.getElementById('areaView').classList.remove('hidden');
                
                backBtn.classList.remove('hidden');
                homeBtn.classList.add('hidden');

                const building = state.buildings.find(b => b.id === state.selectedBuildingId);
                const area = building ? building.areas.find(a => a.id === state.selectedAreaId) : null;

                if (area) {
                    headerTitle.innerText = building.name;
                    document.getElementById('currentAreaName').innerText = area.name;
                    renderDefects(area.defects);
                }
            }
            lucide.createIcons();
        }

        // Navigation
        function navToHome() {
            state.currentView = 'home';
            state.selectedBuildingId = null;
            state.selectedAreaId = null;
            render();
        }

        function navToArea(buildingId, areaId) {
            state.selectedBuildingId = buildingId;
            state.selectedAreaId = areaId;
            state.currentView = 'area';
            render();
        }

        function toggleBuilding(buildingId) {
            const building = state.buildings.find(b => b.id === buildingId);
            if (building) {
                building.isExpanded = !building.isExpanded;
                render();
            }
        }

        // Center Modal System
        function openModal(target, buildingId = null) {
            currentModalTarget = target;
            targetBuildingIdForArea = buildingId;
            const modal = document.getElementById('inputModal');
            const title = document.getElementById('modalTitle');
            const input = document.getElementById('modalInput');
            
            input.value = '';
            if (target === 'building') title.innerText = "เพิ่มรายการอาคาร";
            else if (target === 'area') title.innerText = "เพิ่มรายการพื้นที่/ห้อง";
            else if (target === 'defect') title.innerText = "เพิ่มรายการ Defect";

            modal.classList.remove('hidden');
            setTimeout(() => input.focus(), 100);
        }

        function closeModal() {
            document.getElementById('inputModal').classList.add('hidden');
            currentModalTarget = null;
            targetBuildingIdForArea = null;
        }

        function submitModal() {
            const val = document.getElementById('modalInput').value.trim();
            if (!val) return;

            if (currentModalTarget === 'building') {
                state.buildings.push({
                    id: Date.now(),
                    name: val,
                    isExpanded: true,
                    areas: []
                });
            } else if (currentModalTarget === 'area') {
                const building = state.buildings.find(b => b.id === targetBuildingIdForArea);
                if (building) {
                    building.areas.push({
                        id: Date.now(),
                        name: val,
                        defects: []
                    });
                    building.isExpanded = true;
                }
            } else if (currentModalTarget === 'defect') {
                const defects = getActiveDefects();
                defects.push({
                    id: Date.now(),
                    name: val,
                    total: 0,
                    completed: 0,
                    isEditing: false,
                    isConfirmed: false,
                    tempInput: 0
                });
            }
            closeModal();
            render();
        }

        // Defect Actions
        function toggleEditTotal(defectId) {
            const defects = getActiveDefects();
            const defect = defects.find(d => d.id === defectId);
            if (defect) {
                defect.isEditing = !defect.isEditing;
                defect.tempInput = defect.total;
                render();
            }
        }

        function confirmTotal(defectId) {
            const defects = getActiveDefects();
            const defect = defects.find(d => d.id === defectId);
            const inputEl = document.getElementById(`input-total-${defectId}`);
            const inputVal = parseInt(inputEl ? inputEl.value : 0) || 0;
            
            if (defect && inputVal >= 0) {
                defect.total = inputVal;
                if (defect.completed > defect.total) {
                    defect.completed = defect.total;
                }
                defect.isConfirmed = true;
                defect.isEditing = false;
                render();
            }
        }

        function incrementCompleted(defectId) {
            const defects = getActiveDefects();
            const defect = defects.find(d => d.id === defectId);
            if (defect && defect.isConfirmed && defect.completed < defect.total) {
                defect.completed += 1;
                render();
            }
        }

        function decrementCompleted(defectId) {
            const defects = getActiveDefects();
            const defect = defects.find(d => d.id === defectId);
            if (defect && defect.isConfirmed && defect.completed > 0) {
                defect.completed -= 1;
                render();
            }
        }

        function getActiveDefects() {
            const building = state.buildings.find(b => b.id === state.selectedBuildingId);
            const area = building ? building.areas.find(a => a.id === state.selectedAreaId) : null;
            return area ? area.defects : [];
        }

        // Dynamic Renderers
        function renderBuildings() {
            const container = document.getElementById('buildingList');
            container.innerHTML = '';

            if (state.buildings.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 px-4">
                        <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-400">
                            <i data-lucide="building" class="w-6 h-6 stroke-[1.5]"></i>
                        </div>
                        <p class="text-xs font-medium text-slate-500">ยังไม่มีรายการอาคาร</p>
                        <button onclick="openModal('building')" class="mt-3 text-xs font-semibold text-slate-900 underline underline-offset-4">กดปุ่ม + ด้านบนเพื่อเพิ่มอาคาร</button>
                    </div>
                `;
                return;
            }

            state.buildings.forEach(b => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden transition";

                const header = document.createElement('div');
                header.className = "flex justify-between items-center p-3.5 bg-white cursor-pointer select-none";
                header.onclick = () => toggleBuilding(b.id);

                header.innerHTML = `
                    <span class="font-semibold text-slate-800 text-sm tracking-tight">${b.name}</span>
                    <div class="flex items-center space-x-1">
                        <button onclick="event.stopPropagation(); openModal('area', ${b.id})" class="p-1.5 text-slate-400 hover:text-slate-800 transition">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                        <div class="p-1.5 text-slate-400">
                            <i data-lucide="${b.isExpanded ? 'chevron-up' : 'chevron-down'}" class="w-4 h-4"></i>
                        </div>
                    </div>
                `;

                card.appendChild(header);

                if (b.isExpanded) {
                    const areaList = document.createElement('div');
                    areaList.className = "border-t border-slate-100 divide-y divide-slate-50 bg-slate-50/50";

                    if (b.areas.length === 0) {
                        areaList.innerHTML = `<div class="p-3 text-[11px] text-slate-400 text-center">ไม่มีพื้นที่ (กด + ด้านบนเพื่อเพิ่ม)</div>`;
                    } else {
                        b.areas.forEach(a => {
                            const areaItem = document.createElement('div');
                            areaItem.className = "p-3 px-4 flex items-center justify-between hover:bg-slate-100/60 cursor-pointer text-xs text-slate-700 transition";
                            areaItem.onclick = () => navToArea(b.id, a.id);
                            areaItem.innerHTML = `
                                <span class="font-medium">${a.name}</span>
                                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                            `;
                            areaList.appendChild(areaItem);
                        });
                    }
                    card.appendChild(areaList);
                }

                container.appendChild(card);
            });
        }

        function renderDefects(defects) {
            const container = document.getElementById('defectList');
            container.innerHTML = '';

            if (defects.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 px-4">
                        <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-400">
                            <i data-lucide="check-square" class="w-6 h-6 stroke-[1.5]"></i>
                        </div>
                        <p class="text-xs font-medium text-slate-500">ยังไม่มีรายการ Defect ในพื้นที่นี้</p>
                        <button onclick="openModal('defect')" class="mt-3 text-xs font-semibold text-slate-900 underline underline-offset-4">กดปุ่ม + เพื่อเพิ่ม Defect</button>
                    </div>
                `;
                return;
            }

            defects.forEach(d => {
                const remaining = Math.max(0, d.total - d.completed);
                const canAdd = d.isConfirmed && d.completed < d.total;
                const canSub = d.isConfirmed && d.completed > 0;

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3";

                let box1Content = '';
                if (d.isEditing) {
                    box1Content = `
                        <input id="input-total-${d.id}" type="number" value="${d.tempInput}" min="0" class="w-full text-center border border-slate-200 rounded-lg p-1 text-sm font-semibold my-1 focus:outline-none focus:border-slate-400 bg-white">
                        <button onclick="confirmTotal(${d.id})" class="w-full bg-slate-900 text-white text-[10px] py-1 rounded-md font-medium transition active:scale-95">ยืนยัน</button>
                    `;
                } else {
                    box1Content = `<div class="text-lg font-bold text-slate-800 py-0.5">${d.total}</div>`;
                }

                card.innerHTML = `
                    <div class="text-xs font-semibold text-slate-800 tracking-tight">${d.name}</div>
                    
                    <div class="grid grid-cols-3 gap-2">
                        <!-- ช่องที่ 1: ทั้งหมด -->
                        <div class="bg-slate-50/80 p-2.5 rounded-xl border border-slate-100 flex flex-col justify-between items-center relative">
                            <div class="w-full flex justify-end absolute top-2 right-2">
                                <button onclick="toggleEditTotal(${d.id})" class="text-slate-400 hover:text-slate-700 transition">
                                    <i data-lucide="pencil" class="w-3 h-3"></i>
                                </button>
                            </div>
                            <div class="w-full text-center pt-2">
                                ${box1Content}
                            </div>
                            <span class="text-[10px] text-slate-400 font-medium mt-1">ทั้งหมด</span>
                        </div>

                        <!-- ช่องที่ 2: เก็บแล้ว -->
                        <div class="bg-slate-50/80 p-2.5 rounded-xl border border-slate-100 flex flex-col justify-between items-center">
                            <span class="text-[10px] font-semibold text-slate-500">เก็บแล้ว</span>
                            <div class="text-lg font-bold text-emerald-600 my-0.5">${d.completed}</div>
                            <button onclick="incrementCompleted(${d.id})" ${!canAdd ? 'disabled' : ''} 
                                class="p-1 rounded-full transition ${canAdd ? 'text-slate-800 hover:bg-slate-200/60 active:scale-95' : 'text-slate-300 cursor-not-allowed'}">
                                <i data-lucide="plus-circle" class="w-5 h-5"></i>
                            </button>
                        </div>

                        <!-- ช่องที่ 3: คงเหลือ -->
                        <div class="bg-slate-50/80 p-2.5 rounded-xl border border-slate-100 flex flex-col justify-between items-center">
                            <span class="text-[10px] font-semibold text-slate-500">คงเหลือ</span>
                            <div class="text-lg font-bold text-rose-500 my-0.5">${remaining}</div>
                            <button onclick="decrementCompleted(${d.id})" ${!canSub ? 'disabled' : ''} 
                                class="p-1 rounded-full transition ${canSub ? 'text-slate-800 hover:bg-slate-200/60 active:scale-95' : 'text-slate-300 cursor-not-allowed'}">
                                <i data-lucide="minus-circle" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
